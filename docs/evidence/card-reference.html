<!doctype html><html lang="en"><meta charset="utf-8"><title>Local card reference review</title><style>body{margin:0;background:#090c12;color:#fff;font:14px Arial;display:flex;align-items:center;justify-content:center;gap:30px;height:100vh}video{height:94vh;max-width:80vw}aside{display:grid;gap:12px}button,input{font:inherit;padding:10px}input{width:90px}</style><video id="film" muted playsinline preload="auto" src="card-layout-reference.mp4"></video><aside><label for="time">Reference time (seconds)</label><input id="time" type="number" min="0" max="12" step="0.5" value="0"><button id="seek">Show frame</button><button id="play">Play / pause</button><span id="state">Local reference only</span></aside><script>const film=document.getElementById('film');document.getElementById('seek').onclick=()=>{film.pause();film.currentTime=Number(document.getElementById('time').value)};document.getElementById('play').onclick=()=>film.paused?film.play():film.pause();film.onseeked=()=>document.getElementById('state').textContent='Frame at '+film.currentTime.toFixed(1)+'s';</script></html>
